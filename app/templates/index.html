<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>RetryLab — Luyện tập Python, từng bước rõ ràng</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d1d1f'/%3E%3Cpath d='M16 44V34l12 4 10-20 10 8' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/main.css" />
    <script type="module" src="/static/js/app.js"></script>
  </head>
  <body data-mode="learn">
    <a class="skip-link" href="#main-content">Đến nội dung chính</a>
    <header class="site-header">
      <div class="header-inner">
        <a
          class="brand"
          href="#learn"
          data-route="learn"
          aria-label="RetryLab — Luyện tập"
        >
          <svg width="29" height="29" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" fill="currentColor" />
            <path
              d="M8 22v-5l6 2 5-10 5 4"
              fill="none"
              stroke="white"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>RetryLab</span>
        </a>
        <nav class="primary-nav" aria-label="Điều hướng chính">
          <a href="#learn" data-route="learn">Luyện tập</a>
          <a href="#progress" data-route="progress">Tiến độ</a>
          <a href="#research" data-route="research">Nghiên cứu</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="main-container" tabindex="-1">
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <div id="practice-workspace">{% include 'practice.html' %}</div>
      <div id="research-workspace" hidden>{% include 'research.html' %}</div>
      <footer class="site-footer">
        <span>RetryLab · Thực hành & kiểm chứng</span
        ><a href="#research" data-route="research">Về nền tảng nghiên cứu ↗</a>
      </footer>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
